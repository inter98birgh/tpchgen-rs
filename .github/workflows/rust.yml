name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:  # Allow manual triggering

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run cargo-fmt
        run: "echo skipped-for-baseline-isolation"
      - name: Run cargo-clippy
        run: "echo skipped-for-baseline-isolation"
      - name: Check
        run: "echo skipped-for-baseline-isolation"

  # Tests for tpchgen
  test-tests-tpchgen:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: Tests (tpchgen)
        run: "echo skipped-for-baseline-isolation"

  # doc examples test for tpchgen (takes a while)
  test-doc-tpchgen:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: Doc Tests (tpchgen)
        run: "echo skipped-for-baseline-isolation"

  # All tests for tpchgen-arrow
  test-all-tpchgen-arrow:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: All Tests (tpchgen-arrow)
        run: "echo skipped-for-baseline-isolation"

  # All tests for tpchgen-cli
  test-all-tpchgen-cli:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: All Tests (tpchgen-cli)
        run: cargo test -p tpchgen-cli --test cli_integration

  # All tests for tpcdsgen
  test-all-tpcdsgen:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: All Tests (tpcdsgen)
        run: "echo skipped-for-baseline-isolation"

  # documentation build
  docs:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name : Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: "echo skipped-for-baseline-isolation"

  # Build wheels + sdist (but don’t upload artifacts)
  build-packages:
    uses: ./.github/workflows/build-py-packages.yml
    with:
      upload-artifacts: false
